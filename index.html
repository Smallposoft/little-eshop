<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级购物界面</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>高级购物商城</h1>
            <div class="cart-info">
                <span id="cart-count">购物车: 0</span>
                <span id="total-price">总计: ¥0.00</span>
            </div>
        </header>
        
        <main>
            <div id="product-container" class="product-grid">
                <!-- 商品将通过JavaScript动态加载 -->
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
